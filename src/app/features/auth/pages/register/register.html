<main class="min-h-screen w-full flex bg-slate-50 dark:bg-slate-950 transition-colors duration-500 relative overflow-hidden">
   <!-- Decorative background blobs -->
   <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
      <div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] rounded-full bg-indigo-500/20 dark:bg-indigo-600/10 blur-[120px]"></div>
      <div class="absolute bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-blue-500/20 dark:bg-blue-600/10 blur-[120px]"></div>
   </div>

   <div class="w-full max-w-6xl mx-auto flex items-center justify-center p-4 md:p-8 z-10 relative">
      <div class="w-full grid lg:grid-cols-2 gap-12 items-center bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl border border-white/40 dark:border-slate-800 shadow-2xl rounded-3xl overflow-hidden p-6 md:p-12 transition-all">
         
         <!-- Left Side: Form -->
         <div class="w-full max-w-md mx-auto lg:mx-0 flex flex-col justify-center lg:order-2">
            
            <div class="mb-10 text-center lg:text-left">
               <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 mb-6">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
               </div>
               <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
                  Crea tu cuenta
               </h1>
               <p class="text-slate-600 dark:text-slate-400 text-sm md:text-base leading-relaxed">
                  Únete a TrackFit y comienza a transformar tu vida hoy mismo.
               </p>
            </div>

            <!-- Dynamic Form -->
            <app-dynamic-form [fields]="registerConfig.fields" [buttons]="registerConfig.buttons" />

            <div class="mt-8 text-center">
               <p class="text-sm text-slate-600 dark:text-slate-400 font-medium">
                  ¿Ya tienes una cuenta? 
                  <a href="#" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded px-1">
                     Inicia Sesión
                  </a>
               </p>
            </div>
         </div>

         <!-- Right Side: Image/Visual -->
         <div class="hidden lg:flex w-full h-full min-h-[500px] relative rounded-2xl overflow-hidden shadow-inner lg:order-1">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-600/80 to-purple-600/80 dark:from-indigo-900/80 dark:to-purple-900/80 mix-blend-multiply z-10"></div>
            <img 
              src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop" 
              class="absolute inset-0 w-full h-full object-cover transform scale-105" 
              alt="Fitness lifestyle" />
            <div class="absolute inset-0 z-20 flex flex-col justify-end p-10 text-white">
               <h3 class="text-3xl font-bold mb-2">Supérate a ti mismo</h3>
               <p class="text-indigo-100 font-medium max-w-md opacity-90 leading-relaxed">
                  "El primer paso no te lleva a donde quieres ir, pero te saca de donde estás. Comienza hoy."
               </p>
            </div>
         </div>
         
      </div>
   </div>
</main>
