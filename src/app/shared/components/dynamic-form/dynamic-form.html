<form [formRoot]="dynamicForm" class="flex flex-col gap-5 w-full">
  @for (field of fields() || []; track field.key) {
    <div class="flex flex-col gap-1.5 group">
      <label [for]="field.key" class="text-sm font-medium text-slate-700 dark:text-slate-300 transition-colors group-focus-within:text-blue-600 dark:group-focus-within:text-blue-400">
        {{ field.label }}
      </label>
      
      <!-- Render different inputs based on the field type -->
      @if (field.type === 'checkbox') {
        <div class="flex items-center gap-3 mt-1">
          <p-checkbox 
            [inputId]="field.key" 
            [binary]="true"
            [formField]="getField(field.key)">
          </p-checkbox>
          <label [for]="field.key" class="text-sm text-slate-600 dark:text-slate-400 cursor-pointer hover:text-slate-900 dark:hover:text-slate-200 transition-colors">
            {{ field.label }}
          </label>
        </div>
      } @else if (field.type === 'password') {
        <p-password 
          [inputId]="field.key" 
          [formField]="getField(field.key)"
          [toggleMask]="true"
          [feedback]="false"
          inputStyleClass="w-full !bg-slate-50 dark:!bg-slate-800/50 !border-slate-200 dark:!border-slate-700 focus:!ring-2 focus:!ring-blue-500/50 dark:text-white transition-all duration-300"
        />
      } @else {
        <input 
          pInputText 
          [id]="field.key"
          [type]="field.type"
          [formField]="getField(field.key)"
          class="w-full bg-slate-50! dark:bg-slate-800/50! border-slate-200! dark:border-slate-700! focus:ring-2! focus:ring-blue-500/50! dark:text-white! transition-all duration-300!"
        />
      }
      
      <!-- Error handling -->
      @if (getField(field.key)().invalid() && getField(field.key)().touched()) {
        <small class="text-red-500 dark:text-red-400 text-xs mt-1 animate-fade-in">
          Este campo es inválido.
        </small>
      }
    </div>
  }
  
  <div class="mt-2 flex flex-col gap-4">
    <ng-content></ng-content>
    
    <!-- We hide the default button if custom content is projected, or just keep it as an option -->
    <!-- Buttons -->
    @for (btn of buttons() || []; track $index) { 
      <app-button 
        [label]="btn.label" 
        [type]="btn.type || 'button'" 
        [disabled]="dynamicForm().invalid()" 
        [severity]="btn.severity || 'primary'" 
        [fluid]="btn.fluid || false"
        [size]="btn.size"
        [styleClass]="btn.styleClass || ''">
      </app-button>
    } @empty {
      <!-- Placeholder or do nothing if no buttons -->
    }
  </div>
</form>
