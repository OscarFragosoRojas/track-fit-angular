<app-card [size]="'col-span-12 lg:col-span-12'" [title]="title()" [hoverClass]="''">
    <p-table [value]="data()" dataKey="id" [rows]="10" [paginator]="true"
        [tableStyle]="{ 'min-width': '75rem', 'background': 'transparent' }"
        [class]="'w-full h-full bg-white! dark:bg-primary-900/20! backdrop-blur-xl border border-primary-100/50 dark:border-primary-900/50 shadow-xl shadow-primary-900/5 dark:shadow-none transition-all duration-500 relative overflow-hidden rounded-3xl group border-none!'">
        <ng-template #header>
            <tr class="dark:bg-slate-800/50! bg-primary-50/50!">
                @for (col of columns(); track col.field) {
                <th class="text-center! dark:bg-transparent! dark:text-white! bg-transparent! text-slate-700! border-b! dark:border-white/10! border-primary-100! font-semibold! py-3!">
                    {{ col.header }}
                </th>
                }
            </tr>
        </ng-template>
        <ng-template #body let-row let-rowIndex="rowIndex">
            <tr class="hover:bg-primary-50/60! dark:hover:bg-white/10! transition-colors duration-200 dark:bg-transparent! bg-transparent!">
                @for (col of columns(); track col.field) {
                <td class="text-center! dark:bg-transparent! dark:text-slate-200! bg-transparent! border-b! dark:border-white/5! border-primary-50! py-3!">
                    @if (col.cellTemplate) {
                        <ng-container
                            [ngTemplateOutlet]="col.cellTemplate"
                            [ngTemplateOutletContext]="{ $implicit: row, index: rowIndex }">
                        </ng-container>
                    } @else {
                        {{ (row)[col.field] }}
                    }
                </td>
                }
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td [attr.colspan]="columns().length" class="text-center! py-8! text-slate-400! dark:text-slate-500!">
                    No se encontraron resultados.
                </td>
            </tr>
        </ng-template>
    </p-table>
</app-card>
