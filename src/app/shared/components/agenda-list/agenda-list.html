
<ul class="p-0 m-0 list-none px-4 pb-4">
    @for (item of listItems?.agendaItems; track $index) {
        <li class="flex items-center p-3 mb-2 rounded-2xl hover:bg-surface-50 dark:hover:bg-surface-800/50 transition-all duration-300 cursor-pointer border border-transparent hover:border-surface-200 dark:hover:border-surface-700 group">
            <!-- Avatar con indicador -->
            <div class="relative w-12 h-12 shrink-0 mr-4">
                @if (item.image) {
                                <img [src]="item.image" [alt]="item.name" class="w-full h-full rounded-full object-cover shadow-sm border-2 border-surface-0 dark:border-surface-900 group-hover:border-primary-100 dark:group-hover:border-primary-900 transition-colors">
                            } @else {
                                <div class="w-full h-full flex items-center justify-center bg-primary-100 dark:bg-primary-900/40 rounded-full shadow-sm border-2 border-surface-0 dark:border-surface-900">
                                    <span class="text-primary-500 font-bold text-lg">{{ item.name.charAt(0).toUpperCase() }}</span>
                                </div>
                            }
                        </div>
                        <!-- Información -->
                        <div class="flex flex-col flex-1 min-w-0">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-surface-900 dark:text-surface-0 font-semibold truncate pr-2">{{ item.name }}</span>
                                <p-badge 
                                    [value]="getLabel(item.status)" 
                                    [severity]="getSeverity(item.status)" 
                                    badgeSize="small"
                                    styleClass="text-[10px] uppercase tracking-wider">
                                </p-badge>
                            </div>
                            <div class="flex items-center text-surface-500 text-sm">
                                <i class="pi pi-clock mr-1.5 text-[10px] text-primary-500"></i>
                                <span class="font-medium text-xs">{{ item.time }}</span>
                            </div>
                        </div>
                    </li>
                }
            </ul>
