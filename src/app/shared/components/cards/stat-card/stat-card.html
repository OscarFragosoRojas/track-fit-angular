<p-card 
  class="w-full h-full bg-surface-0 dark:bg-surface-900 shadow-sm hover:shadow-xl hover:shadow-primary/10 hover:-translate-y-1 transition-all duration-500 relative overflow-hidden rounded-xl group border-none" 
  [style]="{ 'padding': '0' }"
>
  <ng-template pTemplate="content">
    <!-- Círculo decorativo: En light es sólido, en dark es sutil como el icono -->
    <div class="w-20 h-20 bg-linear-to-br from-primary to-primary-700 dark:from-primary/20 dark:to-primary/5 rounded-full absolute -right-5 -top-7 shadow-lg shadow-primary/10 flex items-end justify-start p-6 group-hover:scale-110 transition-transform duration-700">
      <i class="{{ kpi.icon }} text-xl"></i>
    </div>

    <!-- Contenido de la Card -->
    <div class="p-6 space-y-5">
      <!-- Textos -->
      <div class="space-y-1.5">
        <h2 class="text-lg font-bold text-surface-900 dark:text-surface-0 tracking-tight group-hover:text-primary transition-colors duration-300">
          {{ kpi.label }}
        </h2>
      </div>

      <!-- Barra de progreso sutil -->
      <div class="pt-1">
        <div class="flex justify-between mb-1.5 items-end">
          <span class="text-2xl font-bold text-primary">{{ kpi.value }}</span>
        </div>
      </div>
    </div>
  </ng-template>
</p-card>
