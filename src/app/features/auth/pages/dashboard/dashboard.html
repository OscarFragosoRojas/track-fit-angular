<div class="grid grid-cols-12 gap-6">
    <!-- Tarjetas de Estadísticas -->    
    <div class="grid grid-cols-4 gap-6 col-span-12">
        @for (statCard of statCards; track $index) {
            <app-stat-card [kpi]="statCard"></app-stat-card>
        }
    </div>

    <!-- Sección de Gráfico / Principal -->
    <div class="col-span-12 lg:col-span-8">
        <div class="bg-surface-0 dark:bg-surface-900 shadow-sm rounded-xl p-6 border border-surface-200 dark:border-surface-700 h-full">
            <div class="font-medium text-xl mb-4 text-surface-900 dark:text-surface-0">Evolución de Pacientes</div>
            <div class="flex items-center justify-center h-[300px] border-2 border-dashed border-surface-200 dark:border-surface-700 rounded-lg bg-surface-50 dark:bg-surface-950">
                <span class="text-surface-500">Aquí puedes colocar un chart de PrimeNG</span>
            </div>
        </div>
    </div>

    <!-- Sección Lateral / Tabla -->
    <div class="col-span-12 lg:col-span-4">
        <div class="bg-surface-0 dark:bg-surface-900 shadow-sm rounded-xl p-6 border border-surface-200 dark:border-surface-700 h-full">
            <div class="font-medium text-xl mb-4 text-surface-900 dark:text-surface-0">Próximas Citas</div>
            <ul class="p-0 m-0 list-none">
                <li class="flex items-center py-4 border-b border-surface-200 dark:border-surface-700">
                    <div class="w-10 h-10 flex items-center justify-center bg-blue-100 dark:bg-blue-900/40 rounded-full mr-3 shrink-0">
                        <span class="text-blue-500 font-bold">JD</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-surface-900 dark:text-surface-0 font-medium mb-1">Juan Domínguez</span>
                        <span class="text-surface-500 text-sm">Hoy, 14:00 hrs</span>
                    </div>
                </li>
                <li class="flex items-center py-4 border-b border-surface-200 dark:border-surface-700">
                    <div class="w-10 h-10 flex items-center justify-center bg-green-100 dark:bg-green-900/40 rounded-full mr-3 shrink-0">
                        <span class="text-green-500 font-bold">MR</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-surface-900 dark:text-surface-0 font-medium mb-1">María Ruiz</span>
                        <span class="text-surface-500 text-sm">Hoy, 15:30 hrs</span>
                    </div>
                </li>
                <li class="flex items-center py-4 border-b border-surface-200 dark:border-surface-700">
                    <div class="w-10 h-10 flex items-center justify-center bg-orange-100 dark:bg-orange-900/40 rounded-full mr-3 shrink-0">
                        <span class="text-orange-500 font-bold">CJ</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-surface-900 dark:text-surface-0 font-medium mb-1">Carlos Jiménez</span>
                        <span class="text-surface-500 text-sm">Mañana, 09:00 hrs</span>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
