<div class="grid grid-cols-12 gap-6">
    <!-- Header -->
     <div class="col-span-12 flex flex-col md:flex-row items-start md:items-end justify-between gap-4 mb-2">
        <div class="flex flex-col">
            <h1 class="text-lg md:text-2xl font-bold text-surface-900 dark:text-surface-0 m-0 tracking-tight">Bienvenido de vuelta,  👋</h1>
            <span class="text-surface-500 dark:text-surface-400 font-medium mt-1">Aquí está tu resumen clínico y métricas del día.</span>
        </div>

        <div class="flex items-center gap-3">
            <button class="px-4 py-2 rounded-xl bg-surface-0 dark:bg-surface-800 hover:bg-surface-100 dark:hover:bg-surface-700 text-surface-700 dark:text-surface-300 font-medium transition-colors flex items-center gap-2 border border-surface-200 dark:border-surface-700 shadow-sm">
                <i class="pi pi-calendar"></i>
                <span class="hidden sm:inline">Ver Agenda</span>
            </button>
            <button class="px-4 py-2 rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-medium shadow-sm shadow-primary-500/20 transition-colors flex items-center gap-2">
                <i class="pi pi-plus"></i>
                <span>Nuevo Paciente</span>
            </button>
        </div>
    </div>
        
    <!-- KPIS con cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 col-span-12">
        @for (statCard of statCards; track $index) {
            <app-stat-card [kpi]="statCard"></app-stat-card>
        }
    </div>

    <!-- Sección de Gráfico / Principal -->
    <app-card 
        [size]="'col-span-12 lg:col-span-8'"
        [title]="'Evolución de Pacientes'"
        [hoverClass]="''">
        <div class="h-[300px]">
            <p-chart type="line" [data]="data" [options]="options" height="300px"></p-chart>
        </div>
    </app-card>

    <!-- Sección Lateral / Tabla -->
     <app-card 
        [size]="'col-span-12 lg:col-span-4'"
        [title]="'Próximas Citas'"
        [hoverClass]="''">
            <app-agenda-list
                [listItems]="patientCards"
                />
    </app-card>

     <app-card 
        [size]="'col-span-12 lg:col-span-8'"
        [title]="'Próximas Citas'"
        [hoverClass]="''">
            <app-agenda-list
                [listItems]="patientCards"
                />
    </app-card>

     <app-card 
        [size]="'col-span-12 lg:col-span-4'"
        [title]="'Próximas Citas'"
        [hoverClass]="''">
            <app-agenda-list
                [listItems]="patientCards"
                />
    </app-card>


</div>
