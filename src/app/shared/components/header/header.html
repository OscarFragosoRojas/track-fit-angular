<div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-4 w-full">
    <div class="flex flex-col">
        <h1 class="text-lg md:text-2xl font-bold text-surface-900 dark:text-surface-0 m-0 tracking-tight">{{message()}}</h1>
        <span class="text-surface-500 dark:text-surface-400 font-medium mt-1">{{subtitle()}}</span>
    </div>

    <div class="flex items-center gap-3">
        @if (showBack()) {
            <app-button 
                [label]="backLabel()" 
                [icon]="'pi pi-arrow-left'" 
                [outlined]="true" 
                [size]="'small'"
                (onClick)="onBack.emit()" />
        }
        @if (showCreate()) {
            <app-button 
                [label]="createLabel()" 
                [icon]="'pi pi-plus'" 
                [size]="'small'"
                (onClick)="onCreate.emit()" />
        }
    </div>
</div>
