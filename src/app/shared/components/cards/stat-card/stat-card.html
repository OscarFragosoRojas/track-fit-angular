<p-card 
  class="w-full h-full bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl border border-white/40 dark:border-slate-800 shadow-lg hover:shadow-2xl hover:shadow-primary/10 hover:-translate-y-1 transition-all duration-500 relative overflow-hidden rounded-3xl group z-10"  
  [style]="{ 'padding': '0' }"
>
  <ng-template pTemplate="content">
    <!-- Círculo decorativo con el icono -->
    <div class="w-20 h-20 {{kpi.iconBgClass}} rounded-full absolute -right-5 -top-7 shadow-lg shadow-primary/10 flex items-end justify-start p-6 group-hover:scale-110 transition-transform duration-700">
      <i class="{{ kpi.icon }} text-xl transition-transform group-hover:rotate-12 {{ kpi.iconColorClass }}"></i>
    </div>

    <!-- Contenido Principal -->
    <div class="p-6 flex flex-col justify-between min-h-[140px]">
      <!-- Superior: Título y Valor -->
      <div class="space-y-1">
        <span class="block text-sm font-bold uppercase tracking-widest text-surface-400 dark:text-surface-500">
          {{ kpi.label }}
        </span>
        <div class="text-3xl font-black text-surface-900 dark:text-surface-0 tracking-tight">
          {{ kpi.value }}
        </div>
      </div>

      <!-- Inferior: Indicadores de Cambio (Trend) -->
      <div class="flex items-center gap-2 pt-4">
        <div 
          class="flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold"
          [ngClass]="{
            'bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400': kpi.changeType === 'positive',
            'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400': kpi.changeType === 'negative',
            'bg-surface-100 text-surface-600 dark:bg-surface-800 dark:text-surface-400': kpi.changeType === 'neutral'
          }"
        >
          <i [class]="kpi.trendIcon" style="font-size: 0.65rem"></i>
          <span>{{ kpi.change }}</span>
        </div>
        <span class="text-[11px] font-medium text-surface-400 dark:text-surface-500">
          {{ kpi.comparisonLabel || 'vs semana pasada' }}
        </span>
      </div> 
    </div>
  </ng-template>
</p-card>
